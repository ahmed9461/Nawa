name: Android CI
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: nawa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Install native toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Unit tests, lint, and release APK
        run: ./gradlew :engine:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon
      - name: Verify actual APK and verify that negative checks fail
        run: |
          set -euo pipefail
          mkdir -p delivery/tools
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          python3 scripts/verify_apk.py "$APK" --aapt2 "$AAPT" --zipalign "$ALIGN" | tee delivery/apk-verification.txt
          if python3 scripts/verify_apk.py "$APK" --aapt2 "$AAPT" --zipalign "$ALIGN" --expected-min-sdk 34 > delivery/negative-verifier-check.txt 2>&1; then
            echo 'ERROR: verifier accepted an intentionally incorrect minimum SDK'; exit 1
          fi
          echo 'Negative verifier check correctly failed.' >> delivery/negative-verifier-check.txt
          cp "$APK" delivery/Nawa-0.2.0-arm64-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/apksigner.jar
          cp "$AAPT" "$ALIGN" delivery/tools/
      - name: Collect reproducible source and reports
        if: always()
        run: |
          mkdir -p delivery
          git rev-parse HEAD > delivery/source-commit.txt
          git archive --format=tar HEAD | gzip > delivery/Nawa-source.tar.gz
          tar -czf delivery/test-reports.tar.gz app/build/reports app/build/test-results engine/build/reports engine/build/test-results 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Nawa-0.2.0-build
          path: delivery/
          retention-days: 30
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Unicode checks with memory sanitizers
        run: |
          c++ -std=c++17 -g -fsanitize=address,undefined tests/native/utf_tests.cpp -o /tmp/nawa-utf-tests
          /tmp/nawa-utf-tests
      - name: Build the same inference core for host validation
        run: |
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target nawa_native_tests -j2
      - name: Download and authenticate tiny public test fixture (not shipped in APK)
        run: |
          mkdir -p build/fixtures
          curl -fL --retry 3 https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -o build/fixtures/stories260K.gguf
          echo '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  build/fixtures/stories260K.gguf' | sha256sum --check
          sha256sum build/fixtures/stories260K.gguf > build/fixture-sha256.txt
      - name: Real GGUF inference and failure-path smoke checks
        run: build/native/nawa_native_tests build/fixtures/stories260K.gguf 2>&1 | tee build/native-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Nawa-native-checks
          path: |
            build/native-smoke.log
            build/fixture-sha256.txt
          if-no-files-found: ignore
          retention-days: 30
