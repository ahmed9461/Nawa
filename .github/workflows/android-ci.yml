name: Android CI
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nawa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Temporary wrapper bootstrap permission; removed once generated wrapper is committed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bootstrap verified Gradle Wrapper once
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p "$RUNNER_TEMP/nawa-wrapper"
            echo 'rootProject.name = "wrapper-bootstrap"' > "$RUNNER_TEMP/nawa-wrapper/settings.gradle.kts"
            CHECKSUM=$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256)
            gradle -p "$RUNNER_TEMP/nawa-wrapper" wrapper --gradle-version 8.13 --distribution-type bin --gradle-distribution-sha256-sum "$CHECKSUM" --no-daemon
            cp "$RUNNER_TEMP/nawa-wrapper/gradlew" .
            cp "$RUNNER_TEMP/nawa-wrapper/gradlew.bat" .
            cp -r "$RUNNER_TEMP/nawa-wrapper/gradle/wrapper" gradle/
            chmod +x gradlew
            if [ "$EVENT" = push ] && [ "$BRANCH" = fix/audit-hardening ]; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add gradlew gradlew.bat gradle/wrapper
              git commit -m 'build: add verified Gradle 8.13 wrapper'
              git push origin "HEAD:$BRANCH"
            fi
          fi
      - name: Install native toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Unit tests, lint, and release APK
        run: ./gradlew :engine:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon
      - name: Verify actual APK
        run: |
          mkdir -p delivery
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign" | tee delivery/apk-verification.txt
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/Nawa-0.2.0-arm64-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/apksigner.jar
      - name: Collect reproducible source and reports
        if: always()
        run: |
          mkdir -p delivery
          git rev-parse HEAD > delivery/source-commit.txt
          git archive --format=tar HEAD | gzip > delivery/Nawa-source.tar.gz
          tar -czf delivery/test-reports.tar.gz app/build/reports app/build/test-results engine/build/reports engine/build/test-results 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nawa-0.2.0-build
          path: delivery/
          retention-days: 30
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Unicode checks with memory sanitizers
        run: |
          c++ -std=c++17 -g -fsanitize=address,undefined tests/native/utf_tests.cpp -o /tmp/nawa-utf-tests
          /tmp/nawa-utf-tests
      - name: Build the same inference core for host validation
        run: |
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target nawa_native_tests -j2
      - name: Download tiny public test fixture (not shipped in APK)
        run: |
          mkdir -p build/fixtures
          curl -fL --retry 3 https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -o build/fixtures/stories260K.gguf
          sha256sum build/fixtures/stories260K.gguf | tee build/fixture-sha256.txt
      - name: Real GGUF inference and failure-path smoke checks
        run: |
          set -o pipefail
          build/native/nawa_native_tests build/fixtures/stories260K.gguf 2>&1 | tee build/native-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nawa-native-checks
          path: |
            build/native-smoke.log
            build/fixture-sha256.txt
          if-no-files-found: ignore
          retention-days: 30
